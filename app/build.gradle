plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mohammed.istighfar'
    compileSdk 34

    defaultConfig {
        applicationId "com.mohammed.istighfar"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}
